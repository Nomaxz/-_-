<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Campass</title>
    <meta name="description" content="Campass — каталог университетов, стран, стоимости обучения и требований для поступления." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Campass" />
    <meta property="og:description" content="Campass — университеты, стоимость обучения и информация для поступления." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Campass" />
    <meta name="twitter:description" content="Campass — университеты, стоимость обучения и информация для поступления." />
    <script>
      (function () {
        var theme = 'light';
        try {
          var stored = null;
          try { stored = window.localStorage.getItem('university-guide-theme'); } catch (e) {}
          if (stored === 'light' || stored === 'dark') theme = stored;
          else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        } catch (e) {}
        var root = document.documentElement;
        if (theme === 'dark') root.classList.add('dark');
        root.style.colorScheme = theme;
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
